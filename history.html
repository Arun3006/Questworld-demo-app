<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestWorld - History</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #222;
        }

        .back {
            font-size: 26px;
            cursor: pointer;
        }

        .header h2 {
            color: #39ff14;
        }

        .balance {
            margin: 20px;
            padding: 20px;
            background: #101010;
            border: 1px solid #39ff14;
            border-radius: 15px;
            text-align: center;
        }

        .balance-title {
            color: #aaa;
            font-size: 14px;
        }

        .balance-value {
            color: #39ff14;
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }

        .history-title {
            margin: 25px 20px 15px;
            font-size: 20px;
        }

        .history-container {
            padding: 0 20px;
        }

        .history-item {
            background: #101010;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #181818;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .name {
            font-size: 16px;
            font-weight: bold;
        }

        .date {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        .credits {
            font-size: 17px;
            font-weight: bold;
        }

        .positive {
            color: #39ff14;
        }

        .negative {
            color: #ff4444;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 50px 20px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #0b0b0b;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            text-align: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .active {
            color: #39ff14;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="back" onclick="goBack()">←</div>
        <h2>Transaction History</h2>
    </div>

    <div class="balance">
        <div class="balance-title">
            Available Credits
        </div>

        <div class="balance-value" id="balance">
            55
        </div>
    </div>

    <h3 class="history-title">
        Recent Transactions
    </h3>

    <div class="history-container" id="historyContainer">
    </div>

    <div class="bottom-nav">

        <div class="nav-item active" onclick="goHome()">
            <div class="nav-icon">⌂</div>
            Home
        </div>

        <div class="nav-item" onclick="goGames()">
            <div class="nav-icon">🎮</div>
            Games
        </div>

        <div class="nav-item" onclick="goRecharge()">
            <div class="nav-icon">💳</div>
            Recharge
        </div>

        <div class="nav-item" onclick="goProfile()">
            <div class="nav-icon">👤</div>
            Profile
        </div>

    </div>

    <script>

        function loadHistory() {

            let credits =
                Number(localStorage.getItem("questworldCredits")) || 55;

            document.getElementById("balance").textContent =
                credits;

            let history =
                JSON.parse(
                    localStorage.getItem("questworldHistory")
                ) || [];

            let container =
                document.getElementById("historyContainer");

            container.innerHTML = "";

            if (history.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No transactions yet.
                    </div>
                `;

                return;
            }

            history.forEach(function(item) {

                let isRecharge =
                    item.type === "recharge";

                let creditText =
                    isRecharge
                        ? "+" + item.credits
                        : item.credits;

                let icon =
                    isRecharge ? "💰" : "🎮";

                let creditClass =
                    isRecharge ? "positive" : "negative";

                let amountText = "";

                if (isRecharge && item.amount) {
                    amountText =
                        "₹" + item.amount + " • ";
                }

                container.innerHTML += `

                    <div class="history-item">

                        <div class="history-left">

                            <div class="icon">
                                ${icon}
                            </div>

                            <div>

                                <div class="name">
                                    ${item.name}
                                </div>

                                <div class="date">
                                    ${amountText}${item.date}
                                </div>

                            </div>

                        </div>

                        <div class="credits ${creditClass}">
                            ${creditText}
                        </div>

                    </div>

                `;
            });
        }


        function goBack() {
            window.location.href =
                "customer-dashboard.html";
        }

        function goHome() {
            window.location.href =
                "customer-dashboard.html";
        }

        function goGames() {
            window.location.href =
                "games/index.html";
        }

        function goRecharge() {
            window.location.href =
                "recharge.html";
        }

        function goProfile() {
            window.location.href =
                "profile.html";
        }

        loadHistory();

    </script>

</body>
</html>
