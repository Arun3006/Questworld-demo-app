<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestWorld - Customer Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #193b20, #071008 40%, #030403 80%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back {
            position: absolute;
            top: 25px;
            left: 20px;
            color: #39ff14;
            font-size: 14px;
            cursor: pointer;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-circle {
            width: 75px;
            height: 75px;
            margin: auto;
            border: 2px solid #39ff14;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(57,255,20,.4);
        }

        .logo-circle span {
            color: #39ff14;
            font-size: 32px;
            font-weight: bold;
        }

        .logo h1 {
            margin-top: 15px;
            color: #39ff14;
            letter-spacing: 3px;
            font-size: 27px;
        }

        .card {
            background: rgba(15,20,16,.9);
            border: 1px solid rgba(57,255,20,.25);
            border-radius: 24px;
            padding: 30px 22px;
            box-shadow: 0 15px 50px rgba(0,0,0,.6);
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .phone-box {
            display: flex;
            background: #0b100c;
            border: 1px solid #333;
            border-radius: 13px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .country {
            padding: 16px 12px;
            color: #39ff14;
            border-right: 1px solid #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 16px 12px;
        }

        input::placeholder {
            color: #555;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 13px;
            background: #39ff14;
            color: #020402;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(57,255,20,.25);
        }

        .login-btn:hover {
            box-shadow: 0 0 30px rgba(57,255,20,.5);
            transform: translateY(-2px);
        }

        .note {
            text-align: center;
            color: #666;
            font-size: 11px;
            margin-top: 18px;
        }

        .note span {
            color: #39ff14;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="back" onclick="goBack()">
            ← Back
        </div>

        <div class="logo">

            <div class="logo-circle">
                <span>Q</span>
            </div>

            <h1>QUESTWORLD</h1>

        </div>

        <div class="card">

            <div class="title">
                Customer Login
            </div>

            <div class="subtitle">
                Enter your registered mobile number
                to access your QuestWorld account.
            </div>

            <label>
                Mobile Number
            </label>

            <div class="phone-box">

                <div class="country">
                    +91
                </div>

                <input
                    type="tel"
                    id="phone"
                    maxlength="10"
                    placeholder="Enter mobile number"
                    oninput="validateNumber()"
                >

            </div>

            <button
                class="login-btn"
                onclick="sendOTP()">

                Continue →

            </button>

            <div class="note">
                Your mobile number is used to identify
                your <span>QuestWorld</span> account.
            </div>

        </div>

    </div>


    <script>

        function validateNumber() {

            let phone = document.getElementById("phone").value;

            phone = phone.replace(/\D/g, "");

            document.getElementById("phone").value = phone;

        }


        function sendOTP() {

            let phone = document.getElementById("phone").value;

            if (phone.length !== 10) {

                alert("Please enter a valid 10-digit mobile number.");

                return;
            }

            // Save customer mobile number
            localStorage.setItem("questworldPhone", phone);

            alert(
                "Demo OTP sent successfully!\n\nOTP: 1234"
            );

            window.location.href = "otp.html";

        }


        function goBack() {

            window.location.href = "index.html";

        }

    </script>

</body>
</html>
