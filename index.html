<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestWorld | Gaming & Experience</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #030403;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(50%);
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(3, 4, 3, 0.35);
            z-index: -1;
        }

        .app {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* LOGO */

        .logo-section {
            text-align: center;
            margin-top: 45px;
        }

        .logo-circle {
            width: 85px;
            height: 85px;
            margin: auto;
            border: 2px solid #39ff14;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 0 15px #39ff14,
                0 0 40px rgba(57, 255, 20, 0.3);
            animation: glow 2s infinite alternate;
        }

        .logo-circle span {
            font-size: 36px;
            font-weight: bold;
            color: #39ff14;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-title {
            margin-top: 18px;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #39ff14;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }

        .tagline {
            margin-top: 8px;
            color: #aaaaaa;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* LOGIN CARD */

        .login-card {
            margin-top: 45px;
            padding: 28px 22px;
            background: rgba(15, 20, 16, 0.88);
            border: 1px solid rgba(57, 255, 20, 0.25);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .welcome {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* BUTTONS */

        .login-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .customer-btn {
            background: #39ff14;
            color: #020402;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.25);
        }

        .customer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.55);
        }

        .staff-btn {
            background: transparent;
            color: #39ff14;
            border: 1px solid #39ff14;
        }

        .staff-btn:hover {
            background: rgba(57, 255, 20, 0.08);
            transform: translateY(-2px);
        }

        .button-icon {
            margin-right: 8px;
        }

        /* FEATURES */

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        .feature {
            text-align: center;
            padding: 13px 5px;
            background: rgba(255, 255, 255, 0.035);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: 0.25s;
        }

        .feature:hover {
            border-color: rgba(57, 255, 20, 0.45);
            background: rgba(57, 255, 20, 0.08);
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .feature-text {
            color: #aaa;
            font-size: 10px;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 30px;
            padding-bottom: 10px;
        }

        .footer span {
            color: #39ff14;
        }

        /* ANIMATION */

        @keyframes glow {
            from {
                box-shadow:
                    0 0 10px #39ff14,
                    0 0 25px rgba(57, 255, 20, 0.2);
            }

            to {
                box-shadow:
                    0 0 20px #39ff14,
                    0 0 50px rgba(57, 255, 20, 0.4);
            }
        }

        /* SMALL MOBILE */

        @media (max-width: 360px) {

            .app {
                padding: 20px 15px;
            }

            .logo-section {
                margin-top: 25px;
            }

            .logo-title {
                font-size: 27px;
            }

            .login-card {
                margin-top: 30px;
                padding: 23px 17px;
            }
        }
    </style>
</head>

<body>

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true">
        <source src="video/QW TV Collage.mp4" type="video/mp4">
    </video>

    <script>
        const backgroundVideo = document.querySelector(".background-video");

        function startBackgroundVideo() {
            backgroundVideo.muted = true;
            backgroundVideo.play().catch(() => {
                window.setTimeout(startBackgroundVideo, 1000);
            });
        }

        backgroundVideo.addEventListener("ended", startBackgroundVideo);
        backgroundVideo.addEventListener("stalled", startBackgroundVideo);
        backgroundVideo.addEventListener("error", startBackgroundVideo);
        startBackgroundVideo();
    </script>

    <div class="app">

        <!-- LOGO SECTION -->

        <div class="logo-section">

            <div class="logo-circle">
                <img
                    src="logo/WhatsApp Image 2026-09-13 at 6.00.06 PM.jpeg"
                    alt="QuestWorld logo">
            </div>

            <div class="logo-title">
                QUESTWORLD
            </div>

            <div class="tagline">
                GAMING • EXPERIENCE • ADVENTURE
            </div>

        </div>


        <!-- LOGIN SECTION -->

        <div>

            <div class="login-card">

                <div class="welcome">
                    Welcome to QuestWorld
                </div>

                <div class="description">
                    Enter the world of gaming, challenges
                    and unforgettable experiences.
                </div>


                <!-- CUSTOMER LOGIN -->

                <button
                    class="login-button customer-btn"
                    onclick="customerLogin()">

                    <span class="button-icon">🎮</span>
                    Customer Login

                </button>


                <!-- STAFF LOGIN -->

                <button
                    class="login-button staff-btn"
                    onclick="staffLogin()">

                    <span class="button-icon">🛠️</span>
                    Staff Login

                </button>


                <!-- FEATURES -->

                <div class="features">

                    <div class="feature">

                        <div class="feature-icon">
                            🎟️
                        </div>

                        <div class="feature-text">
                            Package
                        </div>

                    </div>


                    <a class="feature" href="games/index.html">

                        <div class="feature-icon">
                            🎮
                        </div>

                        <div class="feature-text">
                            Games
                        </div>

                    </a>


                    <a class="feature" href="recharge/index.html">

                        <div class="feature-icon">
                            💳
                        </div>

                        <div class="feature-text">
                            Recharge
                        </div>

                    </a>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            Powered by <span>QuestWorld</span><br>
            © 2026 QuestWorld

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function customerLogin() {
            window.location.href = "customer-login.html";

        }


        function staffLogin() {

            alert("Staff Login coming next! 🛠️");

        }

    </script>

</body>
</html>
