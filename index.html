<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestWorld Games</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            background: #071008;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 760px);
            margin: auto;
        }

        a {
            color: #39ff14;
        }

        h1 {
            color: #39ff14;
            letter-spacing: 2px;
        }

        .game-list {
            display: grid;
            gap: 14px;
            margin-top: 28px;
        }

        .game {
            display: block;
            padding: 20px;
            border: 1px solid rgba(57, 255, 20, 0.35);
            border-radius: 12px;
            background: rgba(15, 20, 16, 0.9);
            text-decoration: none;
        }

        .game:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .game-action {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main>
        <a href="../index.html">Back to QuestWorld</a>
        <h1>QuestWorld Games</h1>
        <p>Select a game deck to open it.</p>

        <div class="game-list">
            <a class="game" href="Game_deck_design_template.pptx.pdf" target="_blank" rel="noopener">
                <div class="game-title">Game Deck Design Template</div>
                <div class="game-action">Open game deck PDF</div>
            </a>
            <a class="game" href="QuestWorld Kids Zone Deck.pdf" target="_blank" rel="noopener">
                <div class="game-title">QuestWorld Kids Zone Deck</div>
                <div class="game-action">Open game deck PDF</div>
            </a>
        </div>
    </main>
</body>
</html>
